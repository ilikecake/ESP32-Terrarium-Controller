        - obj:
            align: CENTER
            width: 228
            height: 250
            pad_all: 10
            scrollable: false
            #scrollbar_mode: "OFF"
            #scroll_dir: "NONE"
            layout:
              pad_column: 0
              type: GRID
              grid_rows: [FR(20), FR(20), FR(20), FR(20), FR(20), FR(20)]
              grid_columns: [FR(10), FR(40), FR(40), FR(10)]
              grid_cell_x_align: START
              grid_cell_y_align: CENTER
            widgets:
              - label:
                  text: "LED:"
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
              - slider:
                  id: led_lvgl_slider
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 2
                  width: 90
                  min_value: 0
                  max_value: 100
                  on_release:
                    - lambda: |-
                        //id(led_light).turn_off().set_effect("None").perform();
                        id(led_light).turn_on().set_effect("None").set_brightness(lv_slider_get_value(led_lvgl_slider)/100.).perform();
                        //id(current_override_val) = id(override_value).state;
                        id(set_override_script).execute();
              - label:
                  text: "Lamp:"
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_x_align: START
                  grid_cell_y_align: CENTER
              - switch:
