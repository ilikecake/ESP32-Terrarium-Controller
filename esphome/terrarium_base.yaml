                  grid_cell_column_pos: 0
              - label:
                  text: "\uF00D"
                  id: lbl_uv_status
                  text_color: 0xFF0000
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 1

        - obj:
            align: TOP_RIGHT
