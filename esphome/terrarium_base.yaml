                  id: heat_lamp_lvgl_switch
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  grid_cell_x_align: START
                  grid_cell_y_align: CENTER
                  on_click:
                    switch.toggle: heatlamp_template_switch
              - label:
                  text: "UV:"
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 1
                  #align: LEFT_MID
              - switch:
