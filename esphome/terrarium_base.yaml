                  grid_cell_row_pos: 4
                  grid_cell_column_pos: 1
                  grid_cell_column_span: 2
                  grid_cell_x_align: CENTER
                  options:
                   - "Auto"
                   - "Manual"
                   - "Summer"
                   - "Off"
                  selected_index: 2
              - button:
                  id: lvgl_clear_override_button
                  grid_cell_row_pos: 5
                  grid_cell_column_pos: 1
                  grid_cell_column_span: 2
                  grid_cell_x_align: CENTER
                  text: "Override Off"
                  on_click:
                    - logger.log: "Override cleared"
                    - script.execute: clear_override_script
                    - script.wait: clear_override_script
                    - script.execute: update_outputs_script

    - id: terrarium_setup_page
