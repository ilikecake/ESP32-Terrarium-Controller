#TODO: If the device is not supposed to be in auto mode when the timer expires, it should not switch back to auto mode.
#TODO: Can I update the label to say how much time is left in override?
script:
  #- id: timer_override_script
  #  mode: restart
  #  then:
  #    - select.set:
  #        id: mode_select
  #        option: "Manual"
  #    - logger.log: "Auto mode paused"
  #    - delay: ${override_delay}
  #    - logger.log: "Auto mode resumed"
  #    - select.set:
  #        id: mode_select
  #        option: "Auto"
          
  - id: set_override_script
    mode: single
    then:
      - logger.log: "Override set"
      - globals.set: 
          id: current_override_val
          value: !lambda |-
            return id(override_value).state;
      - lvgl.label.update:
          id: lbl_mode_value
          text_decor: STRIKETHROUGH
      - lvgl.button.update:
          id: lvgl_clear_override_button
          text: "Override active"
          state: 
            disabled: false
      - lambda: |-
          auto time = id(sntp_time).now();
          id(last_run_min) = time.minute;

  - id: clear_override_script
    mode: single
    then:
      - logger.log: "Override cleared"
      - globals.set: 
          id: current_override_val
          value: "0"
      - lvgl.label.update:
          id: lbl_mode_value
          text_decor: NONE
      - lvgl.button.update:
          id: lvgl_clear_override_button
          text: "Override Off"
          state: 
            disabled: true
            
  - id: decrement_override_script
    mode: single
    then:
      - logger.log: "Override decrement"
      - lambda: |-
          id(current_override_val) -= 1;
          if(id(current_override_val) == 0) {
            //Clear override
            id(clear_override_script).execute();
          }
            
  - id: update_outputs_script
    mode: single
    then:
      - lambda: |-
          auto time = id(sntp_time).now();
          //Device state is not overridden, set up the device based on the current mode.
          if (id(mode_select).current_option() == "Auto") {
            //Auto mode:
            // - Set UV light and heat lamp based on current time
            // - Set LED light to 'daylight' effect
            // - Turn on thermostat (TODO: variable temp for thermostat?)
            ESP_LOGD("Update Script", "Mode: Auto");
            uint16_t uvb_on_min = (id(uvb_on_time).hour*60) + id(uvb_on_time).minute;
            uint16_t uvb_off_min = (id(uvb_off_time).hour*60) + id(uvb_off_time).minute;
            uint16_t heatlamp_on_min = (id(heatlamp_on_time).hour*60) + id(heatlamp_on_time).minute;
            uint16_t heatlamp_off_min = (id(heatlamp_off_time).hour*60) + id(heatlamp_off_time).minute;
            uint16_t now_min = (time.hour*60) + time.minute;

            //UV lamp
            if( (now_min >= uvb_on_min) && (now_min < uvb_off_min) ) {
              if (!id(UV_internal_switch).state) {id(UV_internal_switch).turn_on();}
            } else {
              if (id(UV_internal_switch).state) {id(UV_internal_switch).turn_off();}
            }

            //Heat lamp
            if( (now_min >= heatlamp_on_min) && (now_min < heatlamp_off_min) ) {
              if (!id(heatlamp_internal_switch).state) {id(heatlamp_internal_switch).turn_on();}
            } else {
              if (id(heatlamp_internal_switch).state) {id(heatlamp_internal_switch).turn_off();}
            }

            //LED Lights
            if(id(led_light).get_effect_name() != "Daylight") {
              id(automatic_control_active) = true;
              id(led_light).turn_on().set_effect("Daylight").perform();
              id(automatic_control_active) = false;
            }

            //Thermostat
            //id(heater_thermostat).make_call().set_mode(CLIMATE_MODE_HEAT).perform();
          } else if (id(mode_select).current_option() == "Summer") {
            //Summer mode:
            // - Turn off UV light and heat lamp
            // - Set LED light to 'daylight' effect
            // - Turn off thermostat
            ESP_LOGD("Update Script", "Mode: Summer");

            id(UV_internal_switch).turn_off();
            id(heatlamp_internal_switch).turn_off();
                      
            //LED Lights
            if(id(led_light).get_effect_name() != "Daylight")
            {
              ESP_LOGD("Update Script", "Set LED mode");
              id(automatic_control_active) = true;
              id(led_light).turn_on().set_effect("Daylight").perform();
              id(automatic_control_active) = false;
            }
  
            //Thermostat
            //id(heater_thermostat).make_call().set_mode(CLIMATE_MODE_OFF).perform();
          } else if (id(mode_select).current_option() == "Off") {
            //Off mode:
            // - Turn off UV light and heat lamp
            // - Turn off LED light
            // - Turn off thermostat
            ESP_LOGD("Update Script", "Mode: Off");

            id(UV_internal_switch).turn_off();
            id(heatlamp_internal_switch).turn_off();
            id(automatic_control_active) = true;
            id(led_light).turn_off().perform();
            id(automatic_control_active) = false;
                      
            //Thermostat
            //id(heater_thermostat).make_call().set_mode(CLIMATE_MODE_OFF).perform();  
          } else {
            //Manual mode:
            // - Do nothing
            ESP_LOGD("Update Script", "Mode: Manual");
          }

display:
  - platform: mipi_spi
    id: TFT_display
    model: ILI9341
    dc_pin: A3
    reset_pin: A4
    cs_pin: 12
    #dimensions:
    #  - height: 320
    #  - width: 240
    rotation: 0
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6
    display: "TFT_display"
    id: touchscreen_id
    transform:
      mirror_x: true
      mirror_y: true
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: 
                id: lcd_backlight
                brightness: 60%

lvgl:
  displays: TFT_display
  touchscreens: touchscreen_id
  rotation: 0
  buffer_size: 100%
  refresh_interval: 50ms
  
  pages:
    - id: main_page
      widgets:
        - obj:
            align: TOP_MID
            styles: header_footer
            widgets:
              - label:
                  text: "Terrarium Status"
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xFFFFFF
      
        - label:
            text: "Mode: "
            align: BOTTOM_LEFT
            id: lbl_mode_label
            y: -33
            x: 70
            text_font: montserrat_14

        - label:
            text: "Auto"
            id: lbl_mode_value
            align_to:
