globals:
  - id: last_run_min
    type: int
    restore_value: no
    initial_value: '0'

  #This value is set to numbers >0 when override is active to indicate how many minutes remain in override state.
  # This value is decremented by 1 every minute in the on_time function until it is back to zero.
  - id: current_override_val
    type: int
    restore_value: no
    initial_value: '0'

  - id: automatic_control_active
    type: bool
    restore_value: no
    initial_value: 'false'

  #- id: month_offset
  #  type: int
  #  restore_value: true
  #  initial_value: "6"
    
time:
  - platform: ds1307
    # repeated synchronization is not necessary unless the external RTC
    # is much more accurate than the internal clock
    update_interval: never
    
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time:
      # Every 10 seconds
      - seconds: /10
        minutes: 0-59
        then:
            - if:
                condition:
                  #Check if override is active
                  lambda: "return (id(current_override_val) > 0);"
                then:
                  # Override is active. Check if it is time to decrement the override timer.
                  - lambda: |-
                      auto time = id(sntp_time).now();
                      //Run once per min
                      if(id(last_run_min) != time.minute) {
                        id(last_run_min) = time.minute;
                        id(decrement_override_script).execute();
                      }
                else:
                  # Override is not active
                  - script.execute: update_outputs_script

      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn
                
                
    on_time_sync:
      then:
        # Update the RTC when the synchronization was successful
        ds1307.write_time:

  - platform: template
    id: offset_time
    lambda: |-
      auto current_time = id(sntp_time).now();
      if( (current_time.month > 9) || (current_time.month == 9 && current_time.day_of_month >= 23) || (current_time.month < 3) || (current_time.month == 3 && current_time.day_of_month <= 20)) {
        //Winter, offset time by 6 months.
        return id(sntp_time).timestamp_now() + 6 * 30 * 86400;
      }
      //Summer, return the actual time.
      return id(sntp_time).timestamp_now();

