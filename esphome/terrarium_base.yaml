light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: ws2812
    pin: 18
    num_leds: 1
    name: "RGB LED"
    
#  - platform: esp32_rmt_led_strip
#    channel_colors: GRB
#    pin: 18
#    num_leds: 1
#    chipset: ws2812
#    name: "External NeoPixel"

  - platform: monochromatic
    output: "lcd_backlight_output"
    id: "lcd_backlight"
    name: "LCD Backlight"
    
  - platform: monochromatic
    output: "led_hs_output"
    name: "LED Lights"
    id: led_light
    #internal: true
    on_state:
      - logger.log: "led light on state triggered"
      - lvgl.slider.update:
          id: led_lvgl_slider
          value: !lambda return (int)(100.*id(led_light).remote_values.get_brightness());
      - lvgl.label.update:
          id: lbl_led_pwm_status
          text:
            format: "LED:  %3.0f%%"
            args: [ "(100.*id(led_light).remote_values.get_brightness())" ]
      - if:
          condition:
            lambda: return !(id(automatic_control_active));
          then:
            - logger.log: "Override activated"
            - script.execute: set_override_script
          
    effects:
      - lambda:
          name: Daylight
          update_interval: 10s
          lambda: |-
            float elevation = id(sun_elevation).state;
            float current_brightness = id(led_light).remote_values.get_brightness();
            if(elevation < -18) {
              //Night
              //if (id(led_ls).state) {id(led_ls).turn_off();}
              if(fabs(current_brightness - .3) > .0001) {
                id(automatic_control_active) = true;
                id(led_light).turn_on().set_brightness(0).perform();
                id(automatic_control_active) = false;
              }
            } else if (elevation < 10) {
              //Fade in/out
              //Fade in/out occurs linearly starting at -18 degrees (where twilight becomes night) 
              // and ending at 10 degrees (chosen arbitrarially, about 1 hour after sunrise). This is 
              // mapped to 30-100% dimming of the light. Dimming the light below 30% causes the light
              // to flicker.
              //if (!id(led_ls).state) {id(led_ls).turn_on();}
              float new_brightness = 0.025*elevation + .75;
              if(fabs(current_brightness - new_brightness) > .0001) {
                id(automatic_control_active) = true;
                id(led_light).turn_on().set_brightness(new_brightness).perform();
                id(automatic_control_active) = false;
              }
            } else {
              //Full light
              //if (!id(led_ls).state) {id(led_ls).turn_on();}
              if(fabs(current_brightness - 1.0) > .0001) {
                id(automatic_control_active) = true;
                id(led_light).turn_on().set_brightness(1.0).perform();
                id(automatic_control_active) = false;
              }
            }

