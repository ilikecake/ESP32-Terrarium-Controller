                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 1
                  #align: LEFT_MID
              - switch:
                  #align: CENTER
                  id: heater_lvgl_switch
                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 2
                  #height: 20
                  on_click:
                    switch.toggle: heater_template_switch
              #- label:
              #    text: "Mode:"
              #    grid_cell_row_pos: 4
              #    grid_cell_column_pos: 1
              #    align: LEFT_MID
              - dropdown:
                  id: lvgl_mode_dropdown
